name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Parse version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Expected tag v<major>.<minor>.<patch>"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned installer
        run: ./scripts/build-pkg.sh "${{ steps.version.outputs.version }}"

      - name: Write checksum
        run: |
          cd dist
          shasum -a 256 "translamic-${{ steps.version.outputs.version }}.pkg" > "translamic-${{ steps.version.outputs.version }}.pkg.sha256"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PKG="dist/translamic-${{ steps.version.outputs.version }}.pkg"
          SHA="${PKG}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" "$SHA" --clobber
          else
            gh release create "$TAG" "$PKG" "$SHA" --title "$TAG" --generate-notes --verify-tag
          fi
